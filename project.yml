name: MathTutor
options:
  bundleIdPrefix: com.nordup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CDA73N3FRP
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  markdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    exactVersion: 2.4.0
targets:
  MathTutor:
    type: application
    platform: iOS
    sources:
      - path: MathTutor
    dependencies:
      - package: markdownUI
        product: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nordup.MathTutor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arm64
        TARGETED_DEVICE_FAMILY: "2"
    scheme:
      testTargets:
        - MathTutorTests
        - MathTutorUITests
      gatherCoverageData: true
  MathTutorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MathTutorTests
    dependencies:
      - target: MathTutor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nordup.MathTutorTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
  MathTutorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MathTutorUITests
    dependencies:
      - target: MathTutor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nordup.MathTutorUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
