name: MathTutor
options:
  bundleIdPrefix: com.nordup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CDA73N3FRP
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  markdownExtendedView:
    path: Vendor/MarkdownExtendedView
  # The LaTeX typesetter, already in the graph under MarkdownExtendedView and
  # named here so the app target can link it directly. The board typesets its
  # `math_text` elements with the same engine chat uses (BoardMathStore), so
  # notation on the board and notation in a message match glyph for glyph.
  extendedSwiftMath:
    path: Vendor/ExtendedSwiftMath
  # Google WebRTC as the stasel binary distribution — the transport for live
  # voice chat (Services/Realtime). The same package the sleep app pinned;
  # see docs/research/voice-mode/sleep-app-voice-stack.md §1.
  webRTC:
    url: https://github.com/stasel/WebRTC
    from: 150.0.0
  # SwiftDraw parses an SVG document into Core Graphics draw commands, so the
  # board can raster a figure without a web view. 0.29.0 is the current release;
  # `from` allows a later 0.x, and Package.resolved holds the version a build
  # actually took. See MathTutorTests/SwiftDrawProbeTests.swift, which records
  # what this release does and does not draw.
  swiftDraw:
    url: https://github.com/swhitty/SwiftDraw
    from: 0.29.0
targets:
  MathTutor:
    type: application
    platform: iOS
    sources:
      - path: MathTutor
    dependencies:
      - package: markdownExtendedView
        product: MarkdownExtendedView
      - package: extendedSwiftMath
        product: ExtendedSwiftMath
      - package: webRTC
        product: WebRTC
      - package: swiftDraw
        product: SwiftDraw
    # The device's bearer token, compiled in rather than injected at launch —
    # a build the user taps has no launching process to take it from. The
    # committed file holds no secret; see MathTutor/Config/Backend.xcconfig.
    configFiles:
      Debug: MathTutor/Config/Backend.xcconfig
      Release: MathTutor/Config/Backend.xcconfig
    info:
      path: MathTutor/Info.plist
      properties:
        # Empty when no Backend.local.xcconfig exists, which is a build that
        # cannot reach a tutor rather than a build that fails to compile.
        MathTutorBackendToken: $(MATHTUTOR_BACKEND_TOKEN)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        # A live voice call survives a brief app switch instead of dying the
        # moment the learner glances elsewhere (sleep lesson 9). Audio is the
        # only background mode voice mode needs.
        UIBackgroundModes: [audio]
        # The design is one fixed 1376x1032 landscape layout — "no breakpoints and
        # no responsive reflow". Portrait would need a second design, not a reflow
        # of this one, so the app is landscape-only.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The mic — composer dictation and live voice chat. The string names what is
        # captured, what is done with it, and where it goes, because the speaker is a child
        # thinking out loud: a vague purpose string is a review risk and, more to the point,
        # the only explanation a parent reading the permission alert ever gets.
        #
        # It says the recording leaves the iPad, because it does — dictation and voice chat
        # both run through OpenAI. It says a copy can stay with the session history, because
        # the server records sessions; a promise of deletion the app cannot keep must not be
        # made here. It says OpenAI does not train on it, because that is their stated API
        # policy and it is the thing a parent most wants to know.
        # There is no NSSpeechRecognitionUsageDescription any more: Apple's recogniser is gone,
        # and a permission the app requests but never uses is one a parent is asked for
        # nothing.
        NSMicrophoneUsageDescription: >-
          Math Tutor records your voice while you dictate a message, and during a live
          voice chat for as long as the chat is running. Recordings go to our server and
          to OpenAI to power the tutor, and a copy can stay with your session history.
          OpenAI does not use your voice to train its models.
        # The composer's camera, for photographing a worksheet or a page of a textbook.
        # Written the way the microphone string above is, and for the same reason: it names
        # what is captured, what happens to it and where it goes, because the person reading
        # this alert may be a parent and "to take photos" tells them nothing.
        #
        # It says the photo leaves the iPad, because it does. It says OpenAI does not train
        # on it and may hold it for up to 30 days for abuse monitoring, which is the default
        # for API data — Zero Data Retention exists but is application-gated, so this must
        # not be written as though it applied. And it says the photo is not posted anywhere,
        # because a camera permission in a child's app is the one a parent reads twice.
        NSCameraUsageDescription: >-
          Math Tutor uses the camera only when you tap the camera row in the tutor's message
          box, to take a photo of a worksheet or a page of a book so the tutor can read it.
          The photo is sent to Math Tutor's server and on to OpenAI, which does not use it to
          train its models but can keep it for up to 30 days to check for misuse before
          deleting it. Nothing is posted anywhere or shared with anyone else.
        # Source Sans 3 is the interface face. Shantell Sans Regular is the
        # tutor's vector handwriting face for `ink_text`; no variable axes or
        # synthetic handwriting effects are applied.
        UIAppFonts:
          - SourceSans3-Regular.otf
          - SourceSans3-Medium.otf
          - SourceSans3-Semibold.otf
          - ShantellSans-Normal-Regular.otf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nordup.MathTutor
        TARGETED_DEVICE_FAMILY: "2"
    scheme:
      testTargets:
        - MathTutorTests
        - MathTutorUITests
      gatherCoverageData: true
  MathTutorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MathTutorTests
    dependencies:
      - target: MathTutor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nordup.MathTutorTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
  MathTutorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MathTutorUITests
    dependencies:
      - target: MathTutor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nordup.MathTutorUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
