# macOS packaging (decision D7): `npm run dist:mac` (scripts/dist-mac.mjs)
# builds a signed, notarized universal .dmg into release/.
# The name comes from package.json "productName"; the icon is resources/icon.png.

appId: com.askaboard.app

directories:
  output: release
  buildResources: build

# The bundled app (electron-vite output) and package.json. electron-builder adds
# the production node_modules by itself (the main process loads them at run time).
files:
  - out/**/*
  - package.json
  # electron-builder drops every dependency's top-level `examples` folder, but worlds import
  # three's helpers (three/addons, three/examples/jsm) through live-item-protocol.ts.
  - from: node_modules/three/examples/jsm
    to: node_modules/three/examples/jsm

# Read at run time from process.resourcesPath/resources (src/main/resources.ts):
# the brief, the guide, the learning-folder template, the .mcpb, the live module.
extraResources:
  - from: resources
    to: resources
  # The app's own license and the notices of the open-source work it ships (THIRD_PARTY_NOTICES.md).
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

# The stdio relay runs outside the app: the shim (~/.askaboard/bin/askaboard)
# hands this file to the app's binary as Node (src/main/agent-home.ts), so it
# must be a real file, at app.asar.unpacked/out/relay/index.js.
asarUnpack:
  - out/relay/**

# No native modules in the production dependencies.
npmRebuild: false

# Electron fuses (decision D13), flipped in the binary at package time.
# runAsNode stays on: the agent shim runs the relay with ELECTRON_RUN_AS_NODE
# (src/main/agent-home.ts). grantFileProtocolExtraPrivileges stays on (the
# default): the window loads out/renderer/index.html from file:// (loadFile),
# and its module scripts need it.
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

mac:
  icon: resources/icon.png
  category: public.app-category.education
  target:
    - target: dmg
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # electron-builder finds the Developer ID identity and notarizes the app.
  # dist-mac.mjs requires the identity and a working notarytool profile.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # No auto-update, so no .blockmap next to the dmg.
  writeUpdateInfo: false
  # The window title without the version and arch of the file name.
  title: ${productName}
  # The board's dot grid with an ink arrow and "drag me over" (assets/brand/export.mjs
  # makes it). dmg-builder pairs dmg-background@2x.png with it for Retina screens.
  background: build/dmg-background.png
  iconSize: 112
  window:
    width: 540
    height: 380
  # Icon centres, in window points: on the two ends of the arrow in the background.
  contents:
    - x: 142
      y: 174
      type: file
    - x: 398
      y: 174
      type: link
      path: /Applications

publish: null
