[project]
name = "mathtutor-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Imported directly by app/api/turn.py for `move_on_after(shield=True)`,
    # the construct that lets a disconnected turn still record itself. It
    # arrives transitively through Starlette either way, but a direct import
    # is a direct dependency: pinned here so a resolver is never free to drop
    # it, and so the version floor is stated by the code that needs it.
    "anyio>=4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=2.8",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "pgvector>=0.3",
    "pillow>=11.0",
    "pillow-heif>=0.21",
    "pymupdf>=1.25",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
